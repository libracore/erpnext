[project]
name = "erpnext"
authors = [
    { name = "libracore AG", email = "info@libracore.com"}
]
description = "Open Source Enterprise Resource Planning Platform"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # dependencies
    "frappe>=15.45.0",
    "unidecode~=1.3.7",
    "pygithub~=2.1.1",
    "googlemaps~=4.10.0",
    "python-stdnum~=1.19",
    "woocommerce~=3.0.0",
    "pandas~=2.3.3",                        # use pandas > 2.3 for python 3.13 compatibility (debian 13)
    "plaid-python==7.2.1",
    "python-youtube~=0.8.3",                # note: DO NOT USE 0.9.5, because this will lead to a depencency conflict
    "barcodenumber~=0.5.0",
    "future~=1.0.0",
    "stripe~=11.2.0",
    "gocardless~=0.5.3",
    "gocardless-pro~=1.48.0",
    "pycountry~=22.3.5",
    "rapidfuzz~=3.12.2",
    "holidays~=0.28",

    # Not used directly - required by PyQRCode for PNG generation
    "pypng~=0.20220715.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]
coverage = "~=6.5.0"
Faker = "~=18.10.1"
pyngrok = "~=6.0.0"
unittest-xml-reporting = "~=3.2.0"
watchdog = "~=3.0.0"
hypothesis = "~=6.77.0"
responses = "==0.23.1"
freezegun = "~=1.2.2"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "RUF001", # string contains ambiguous unicode character
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.frappix]
# use identifier from https://search.nixos.org/packages
nixpkgs-deps = [
    "mariadb",
    "restic",
    "wkhtmltopdf-bin",
    "which",
    "gzip",
    "bash",
    "redis",
    "nodejs_20",
    "python312",
]

[project.urls]
Homepage = "https://git.libracore.io/libracore/erpnext"
Repository = "https://git.libracore.io/libracore/erpnext.git"
"Bug Reports" = "https://git.libracore.io/libracore/erpnext/issues"
